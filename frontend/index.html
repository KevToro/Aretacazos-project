<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configura la codificación de texto para leer tildes y eñes sin problemas -->
    <meta charset="UTF-8">

    <!-- Permite que la pantalla se adapte al tamaño de dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aretacazos 🌮 | Menú & Registro</title>

    <!-- Vincula el archivo CSS para estilos -->
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <header class="navbar">
        <h1>🌮 Aretacazos 🌮</h1>
        <p>EL RINCÓN MEXICANO</p>
    </header>

    <!-- CONTENIDO PRINCIPAL DE LA APLICACIÓN -->
     <main class=" container">
        <!--- Bloque 1: formularios para registrar clientes -->
        <section class ="card-section">
            <h2>Registrar de Clientes</h2>
            <form id="customer-form">
                <div class="form-group">
                    <label for="name">Nombre completo:</label>
                    <input type="text" id="name" required placeholder=" EJ: Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" required placeholder=" EJ:ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono:</label>
                    <input type="tel" id="phone" required placeholder=" EJ: 3185259636">
                    </div>

                <button type="submit">Registrarme</button>
            </form>

            <!-- Caja donde mostramos las alertas de éxito o error al enviar el formulario -->
            <div id="form-message" class="message-box"></div>
        </section>

        <!-- BLOQUE2 : Área de menú -->
        <section class="card-section">
            <h2>Menú</h2>
            <!-- Este div inicia con un texto temporal, pero JavaScript inyectará las categorías y productos de Supabase aquí -->
            <div id="menu-container">
                <p class="loading-message">Cargando menú...</p>
            </div>
        </section>
                
     </main>

     <!-- 
      Cargamos main.js usando type="module" para poder usar sintaxis 
      de import/export entre nuestros archivos JavaScript 
    -->
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
